version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: youtube_ai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v22.0}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/youtube_ai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YOUTUBE_CLIENT_SECRETS: ${YOUTUBE_CLIENT_SECRETS:-client_secrets.json}
      YOUTUBE_TOKEN_JSON: ${YOUTUBE_TOKEN_JSON:-youtube_token.json}
      DAILY_NEWS_AUTOPUBLISH_ENABLED: ${DAILY_NEWS_AUTOPUBLISH_ENABLED:-false}
      DAILY_NEWS_PUBLISH_TIME: ${DAILY_NEWS_PUBLISH_TIME:-20:00}
      DAILY_NEWS_TIMEZONE: ${DAILY_NEWS_TIMEZONE:-Asia/Kolkata}
    ports:
      - "8000:8000"
    volumes:
      - .:/app:delegated

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "4173:4173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"

volumes:
  db_data:
